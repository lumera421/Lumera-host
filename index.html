<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lumera Host</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.8/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#eef2ff;--paper:#ffffff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;
  --blue:#1d4ed8;--blue2:#2563eb;--soft:#dbeafe;--green:#059669;--danger:#dc2626;
  --shadow:0 10px 30px rgba(37,99,235,.10);--radius:16px;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{
  font-family:Tahoma,"Segoe UI",system-ui,sans-serif;color:var(--ink);
  background:
    radial-gradient(1200px 600px at 100% -10%, rgba(37,99,235,.18), transparent 55%),
    radial-gradient(900px 500px at -10% 110%, rgba(14,165,233,.12), transparent 50%),
    linear-gradient(180deg,#f8fafc 0%,#eef2ff 100%);
  overflow-x:hidden;
}
button,input,textarea{font:inherit}
.hidden{display:none!important}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes pop{0%{transform:scale(.96);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes shimmer{0%{background-position:200% 0}100%{background-position:-200% 0}}
@keyframes pulseSoft{0%,100%{box-shadow:0 0 0 0 rgba(37,99,235,.25)}70%{box-shadow:0 0 0 12px rgba(37,99,235,0)}}
.anim{animation:fadeUp .55s ease both}
.anim-d1{animation-delay:.06s}.anim-d2{animation-delay:.12s}.anim-d3{animation-delay:.18s}

/* AUTH */
#auth-screen{min-height:100vh;display:grid;grid-template-columns:1.15fr .85fr}
@media(max-width:860px){#auth-screen{grid-template-columns:1fr}.auth-side{order:-1;min-height:200px}}
.auth-form-wrap{display:flex;align-items:center;justify-content:center;padding:40px 20px}
.auth-box{width:100%;max-width:400px;animation:fadeUp .6s ease both}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--blue2);font-weight:800;margin-bottom:10px}
.auth-box h1{font-size:1.75rem;font-weight:900;letter-spacing:-.02em;margin-bottom:8px}
.lead{color:var(--muted);line-height:1.75;font-size:.93rem;margin-bottom:22px}
.switch{display:inline-flex;background:rgba(255,255,255,.7);border:1px solid var(--line);border-radius:12px;padding:4px;margin-bottom:18px;backdrop-filter:blur(8px)}
.switch button{border:0;background:transparent;padding:9px 18px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:700;transition:.2s}
.switch button.on{background:var(--blue);color:#fff;box-shadow:0 6px 16px rgba(37,99,235,.35)}
.field{margin-bottom:12px}
.field label{display:block;font-size:.8rem;font-weight:700;margin-bottom:6px;color:#334155}
.field input{
  width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;outline:0;
  background:rgba(255,255,255,.9);transition:.2s;
}
.field input:focus{border-color:#93c5fd;box-shadow:0 0 0 4px rgba(37,99,235,.12)}
.btn{border:0;border-radius:12px;padding:12px 16px;font-weight:800;cursor:pointer;transition:.2s transform,.2s box-shadow,.2s background}
.btn:active{transform:scale(.98)}
.btn-main{width:100%;background:linear-gradient(135deg,#1e3a8a,#2563eb);color:#fff;box-shadow:0 10px 24px rgba(37,99,235,.35)}
.btn-main:hover{filter:brightness(1.06)}
.btn-main:disabled{opacity:.55;cursor:wait}
.btn-green{background:linear-gradient(135deg,#047857,#10b981);color:#fff;box-shadow:0 8px 20px rgba(5,150,105,.3)}
.btn-soft{background:#fff;border:1px solid var(--line);color:var(--ink)}
.btn-soft:hover{background:#f8fafc;border-color:#cbd5e1}
.btn-danger{background:#fff;border:1px solid #fecaca;color:var(--danger)}
.btn-danger:hover{background:#fef2f2}
.msg{margin-top:12px;font-size:.88rem;min-height:1.2em}
.msg.err{color:var(--danger)}.msg.ok{color:var(--green)}
.auth-side{
  position:relative;overflow:hidden;color:#eef4ff;
  background:linear-gradient(160deg,#0b1b3a 0%,#1e3a8a 55%,#2563eb 100%);
  padding:44px 36px;display:flex;flex-direction:column;justify-content:space-between;
}
.auth-side .blob{position:absolute;border-radius:50%;filter:blur(2px);opacity:.35;animation:floaty 7s ease-in-out infinite}
.auth-side .blob.a{width:220px;height:220px;background:#38bdf8;right:-40px;top:20%;}
.auth-side .blob.b{width:160px;height:160px;background:#818cf8;left:-30px;bottom:10%;animation-delay:-2s}
.auth-side .mark,.auth-side h2,.auth-side p,.auth-side .foot{position:relative;z-index:1}
.auth-side .mark{font-size:12px;letter-spacing:.14em;opacity:.75;margin-bottom:14px;font-weight:700}
.auth-side h2{font-size:clamp(1.7rem,3.2vw,2.35rem);line-height:1.25;font-weight:900;max-width:12ch}
.auth-side p{margin-top:14px;opacity:.85;line-height:1.75;max-width:32ch;font-size:.95rem}
.auth-side .foot{display:flex;gap:8px;flex-wrap:wrap;margin-top:28px}
.auth-side .foot span{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);padding:7px 12px;border-radius:999px;font-size:.75rem;backdrop-filter:blur(6px)}

/* APP */
#app-screen{display:none;min-height:100vh;flex-direction:column}
#app-screen.show{display:flex;animation:fadeIn .35s ease}
.topbar{
  position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;
  padding:12px 18px;background:rgba(255,255,255,.82);border-bottom:1px solid rgba(226,232,240,.9);
  backdrop-filter:blur(14px);
}
.brand{font-weight:900;color:var(--blue);display:flex;gap:10px;align-items:center}
.brand b{
  width:32px;height:32px;border-radius:10px;display:grid;place-items:center;color:#fff;font-size:11px;
  background:linear-gradient(135deg,#1e3a8a,#3b82f6);box-shadow:0 6px 14px rgba(37,99,235,.35);
}
.menu-wrap{position:relative}
.menu-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#fff;cursor:pointer;font-size:18px;transition:.2s}
.menu-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.dropdown{
  position:absolute;left:0;top:calc(100% + 8px);width:240px;background:#fff;border:1px solid var(--line);
  border-radius:14px;box-shadow:0 18px 40px rgba(15,23,42,.12);padding:8px;animation:pop .2s ease;
}
.dropdown .who{padding:10px;border-bottom:1px solid var(--line);margin-bottom:4px}
.dropdown .who strong{display:block;font-size:.92rem}
.dropdown .who span{color:var(--muted);font-size:.78rem}
.dropdown button{width:100%;text-align:right;border:0;background:transparent;padding:10px;border-radius:10px;cursor:pointer}
.dropdown button:hover{background:var(--soft)}

.content{width:min(960px,100%);margin:0 auto;padding:26px 16px 56px;flex:1}
.welcome{
  background:linear-gradient(135deg,rgba(255,255,255,.95),rgba(219,234,254,.75));
  border:1px solid #c7d2fe;border-radius:20px;padding:20px 22px;margin-bottom:18px;
  display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;align-items:center;
  box-shadow:var(--shadow);animation:fadeUp .5s ease both;
}
.welcome h2{font-size:1.15rem;margin-bottom:4px}
.welcome p{color:var(--muted);font-size:.9rem;line-height:1.6}
.badge-free{
  background:linear-gradient(135deg,#059669,#34d399);color:#fff;font-weight:800;font-size:.78rem;
  padding:8px 12px;border-radius:999px;white-space:nowrap;animation:pulseSoft 2.4s infinite;
}
.grid2{display:grid;grid-template-columns:1.15fr 1fr;gap:14px;margin-bottom:22px}
@media(max-width:720px){.grid2{grid-template-columns:1fr}}
.card{
  background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:var(--radius);
  padding:20px;box-shadow:var(--shadow);transition:.25s transform,.25s box-shadow;animation:fadeUp .55s ease both;
}
.card:hover{transform:translateY(-3px);box-shadow:0 16px 40px rgba(37,99,235,.14)}
.card h3{margin-bottom:8px;font-size:1.05rem}
.card p{color:var(--muted);font-size:.9rem;line-height:1.65;margin-bottom:14px}
.plans{display:grid;gap:8px}
.plan{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:#f8fafc;transition:.2s}
.plan:hover{border-color:#bfdbfe;background:#eff6ff}
.plan strong{font-size:.92rem}.plan span{font-size:.78rem;color:var(--muted)}
.tag{font-size:.7rem;background:var(--soft);color:var(--blue2);padding:3px 8px;border-radius:7px;font-weight:700}
.section-h{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.section-h .tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.search{
  border:1px solid var(--line);border-radius:11px;padding:9px 12px;outline:0;min-width:180px;background:#fff;
}
.search:focus{border-color:#93c5fd;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.plist{display:grid;gap:10px}
.prow{
  display:flex;justify-content:space-between;gap:12px;align-items:center;
  padding:14px 16px;background:rgba(255,255,255,.95);border:1px solid var(--line);border-radius:14px;
  transition:.22s transform,.22s box-shadow,.22s border-color;animation:fadeUp .45s ease both;
}
.prow:hover{transform:translateY(-2px);border-color:#bfdbfe;box-shadow:var(--shadow)}
.prow .n{font-weight:800}
.prow .s{font-size:.75rem;color:var(--muted);direction:ltr;text-align:left;margin-top:3px;word-break:break-all}
.prow .meta{font-size:.72rem;color:#94a3b8;margin-top:4px}
.prow .acts{display:flex;gap:6px;flex-wrap:wrap}
.ws-head{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;margin-bottom:14px;animation:fadeUp .4s ease}
.linkbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:linear-gradient(135deg,#eff6ff,#dbeafe);border:1px solid #bfdbfe;padding:10px;border-radius:12px;direction:ltr}
.linkbar code{font-size:.78rem;color:var(--blue);word-break:break-all;flex:1;min-width:120px}
.flist{display:grid;gap:8px;margin:12px 0}
.frow{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:#fff;transition:.2s;animation:fadeUp .35s ease both}
.frow:hover{border-color:#bfdbfe}
.frow .fn{font-weight:700;direction:ltr;text-align:left}
.frow .acts{display:flex;gap:5px;flex-wrap:wrap}
.drop{border:1.5px dashed #94a3b8;border-radius:14px;padding:22px;text-align:center;background:rgba(255,255,255,.7);margin-top:12px;transition:.2s}
.drop.on{border-color:var(--blue2);background:#eff6ff;transform:scale(1.01)}
.drop input{margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:32px 16px;border:1px dashed #cbd5e1;border-radius:16px;background:rgba(255,255,255,.55)}
.modal-back{position:fixed;inset:0;background:rgba(15,23,42,.45);display:flex;align-items:center;justify-content:center;z-index:60;padding:12px;animation:fadeIn .2s ease;backdrop-filter:blur(4px)}
.modal{width:min(720px,100%);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:18px;box-shadow:0 25px 60px rgba(0,0,0,.2);animation:pop .25s ease}
.modal h3{margin-bottom:10px}
.modal textarea{width:100%;min-height:250px;border:1px solid var(--line);border-radius:12px;padding:12px;direction:ltr;text-align:left;font-family:ui-monospace,Consolas,monospace;font-size:.8rem}
.modal-actions{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
#view-screen{display:none;position:fixed;inset:0;z-index:100;background:#fff}
#view-screen.show{display:block}
.view-bar{height:36px;background:#0f172a;color:#e2e8f0;font-size:12px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;direction:ltr}
#view-frame{width:100%;height:calc(100% - 36px);border:0}
.toast-wrap{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#0f172a;color:#fff;padding:11px 16px;border-radius:12px;font-size:.88rem;box-shadow:0 12px 30px rgba(0,0,0,.25);animation:fadeUp .3s ease;pointer-events:auto}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 14px;min-width:110px}
.stat b{display:block;font-size:1.15rem;color:var(--blue)}
.stat span{font-size:.75rem;color:var(--muted)}
</style>
</head>
<body>
<section id="auth-screen">
  <div class="auth-form-wrap">
    <div class="auth-box">
      <div class="eyebrow">Lumera Studio</div>
      <h1>ورود به Host</h1>
      <p class="lead">رایگان و نامحدود پروژه بساز. HTML بگذار، لینک عمومی بگیر — بدون کد ایمیل.</p>
      <div class="switch">
        <button type="button" class="on" id="tab-login">ورود</button>
        <button type="button" id="tab-signup">ثبت‌نام</button>
      </div>
      <form id="auth-form">
        <div class="field"><label>ایمیل</label><input id="auth-email" type="email" dir="ltr" required placeholder="you@email.com"></div>
        <div class="field"><label>رمز عبور</label><input id="auth-pass" type="password" dir="ltr" required minlength="6" placeholder="حداقل ۶ کاراکتر"></div>
        <div class="field hidden" id="pass2-wrap"><label>تکرار رمز</label><input id="auth-pass2" type="password" dir="ltr" minlength="6"></div>
        <button class="btn btn-main" type="submit" id="auth-submit">ورود</button>
        <div class="msg" id="auth-msg"></div>
      </form>
    </div>
  </div>
  <aside class="auth-side">
    <div class="blob a"></div><div class="blob b"></div>
    <div>
      <div class="mark">LUMERA HOST</div>
      <h2>هاست وبِ سبک و سریع</h2>
      <p>پروژه نامحدود، ویرایش آنلاین، لینک عمومی و پیش‌نمایش — همه رایگان.</p>
    </div>
    <div class="foot"><span>پروژه نامحدود</span><span>آپلود فایل</span><span>ویرایش کد</span><span>لینک عمومی</span></div>
  </aside>
</section>

<section id="app-screen">
  <header class="topbar">
    <div class="brand"><b>LH</b> Lumera Host</div>
    <div class="menu-wrap">
      <button type="button" class="menu-btn" id="menu-btn" aria-label="منو">⋮</button>
      <div class="dropdown hidden" id="menu-drop">
        <div class="who"><strong id="menu-name">کاربر</strong><span id="menu-email"></span></div>
        <button type="button" id="menu-projects">پروژه‌ها</button>
        <button type="button" id="menu-logout">خروج</button>
      </div>
    </div>
  </header>
  <main class="content" id="main-content"></main>
</section>

<section id="view-screen">
  <div class="view-bar"><span id="view-label">Lumera Host</span><a href="#" id="view-home" style="color:#93c5fd">Home</a></div>
  <iframe id="view-frame" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
</section>
<div class="toast-wrap" id="toasts"></div>

<script>
(function () {
  var URL = 'https://cnvxbwdjuwczowaqgmia.supabase.co';
  var KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNudnhid2RqdXdjem93YXFnbWlhIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA5MzE5NDQsImV4cCI6MjEwNjUwNzk0NH0.OB5lXXhHQXdnHlJU5azIuHHZ8G339BSNl4aieTDKeX8';
  if (!window.supabase || !window.supabase.createClient) {
    document.body.innerHTML = '<p style="padding:2rem;direction:rtl;font-family:Tahoma">کتابخانه لود نشد.</p>';
    return;
  }
  var sb = window.supabase.createClient(URL, KEY, {
    global: { headers: { apikey: KEY, Authorization: 'Bearer ' + KEY } }
  });

  var SK = 'lh_user_v3';
  var $ = function (s, r) { return (r || document).querySelector(s); };
  var authScreen = $('#auth-screen');
  var appScreen = $('#app-screen');
  var viewScreen = $('#view-screen');
  var main = $('#main-content');
  var mode = 'login';
  var user = null;
  var currentProject = null;
  var allProjects = [];

  function toast(text) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    $('#toasts').appendChild(el);
    setTimeout(function () { el.style.opacity = '0'; el.style.transition = '.3s'; setTimeout(function () { el.remove(); }, 300); }, 2200);
  }
  function saveUser(u) {
    user = u;
    if (u) {
      u.project_limit = 99999;
      u.plan = u.plan || 'free';
      localStorage.setItem(SK, JSON.stringify(u));
    } else localStorage.removeItem(SK);
  }
  function loadUser() {
    try { user = JSON.parse(localStorage.getItem(SK) || 'null'); } catch (e) { user = null; }
    if (user) { user.project_limit = 99999; }
    return user;
  }
  async function sha256(text) {
    var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
    return Array.from(new Uint8Array(buf)).map(function (b) { return b.toString(16).padStart(2, '0'); }).join('');
  }
  async function passHash(email, pass) {
    return sha256(String(email).toLowerCase().trim() + '|' + pass + '|lumera-host-v2');
  }
  function publicBase() {
    return location.origin + location.pathname.replace(/index\.html$/i, '');
  }
  function projectUrl(slug) { return publicBase() + '?p=' + encodeURIComponent(slug); }
  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c];
    });
  }
  function fmtDate(iso) {
    if (!iso) return '';
    try {
      var d = new Date(iso);
      return d.toLocaleDateString('fa-IR') + ' ' + d.toLocaleTimeString('fa-IR', { hour: '2-digit', minute: '2-digit' });
    } catch (e) { return ''; }
  }

  async function tryPublicView() {
    var slug = new URLSearchParams(location.search).get('p');
    if (!slug) return false;
    authScreen.classList.add('hidden');
    appScreen.classList.remove('show');
    viewScreen.classList.add('show');
    $('#view-label').textContent = 'Lumera Host · ' + slug;
    $('#view-home').href = publicBase();
    try {
      var res = await sb.from('host_projects').select('id,name,slug').eq('slug', slug).maybeSingle();
      if (res.error || !res.data) {
        document.body.innerHTML = '<div style="padding:40px;text-align:center;font-family:Tahoma;direction:rtl"><h2>پروژه پیدا نشد</h2></div>';
        return true;
      }
      var fr = await sb.from('host_files').select('filename,content').eq('project_id', res.data.id);
      var list = fr.data || [];
      var htmlFile = list.find(function (f) { return /^index\.html$/i.test(f.filename); })
        || list.find(function (f) { return /\.html$/i.test(f.filename); }) || list[0];
      if (!htmlFile) {
        $('#view-frame').srcdoc = '<p style="padding:2rem;font-family:Tahoma;direction:rtl">فایلی نیست</p>';
        return true;
      }
      var body = htmlFile.content || '';
      var css = list.filter(function (f) { return /\.css$/i.test(f.filename); });
      if (css.length && !/<link[^>]+stylesheet/i.test(body)) {
        var styles = css.map(function (c) { return '<style>' + c.content + '</style>'; }).join('\n');
        if (/<\/head>/i.test(body)) body = body.replace(/<\/head>/i, styles + '</head>');
        else body = styles + body;
      }
      $('#view-frame').srcdoc = body;
    } catch (e) {
      console.error(e);
      $('#view-frame').srcdoc = '<p style="padding:2rem;direction:rtl;font-family:Tahoma">خطا در بارگذاری</p>';
    }
    return true;
  }

  function setMode(m) {
    mode = m;
    $('#tab-login').classList.toggle('on', m === 'login');
    $('#tab-signup').classList.toggle('on', m === 'signup');
    $('#pass2-wrap').classList.toggle('hidden', m === 'login');
    $('#auth-submit').textContent = m === 'login' ? 'ورود' : 'ثبت‌نام';
    $('#auth-msg').textContent = '';
    $('#auth-msg').className = 'msg';
  }
  $('#tab-login').onclick = function () { setMode('login'); };
  $('#tab-signup').onclick = function () { setMode('signup'); };

  $('#auth-form').onsubmit = async function (e) {
    e.preventDefault();
    var email = $('#auth-email').value.trim().toLowerCase();
    var pass = $('#auth-pass').value;
    var msg = $('#auth-msg');
    var btn = $('#auth-submit');
    msg.className = 'msg';
    if (!email || !pass) { msg.className = 'msg err'; msg.textContent = 'ایمیل و رمز لازم است'; return; }
    btn.disabled = true;
    msg.textContent = 'صبر کنید...';
    try {
      var hash = await passHash(email, pass);
      var data;
      if (mode === 'signup') {
        if (pass !== $('#auth-pass2').value) throw new Error('تکرار رمز اشتباه است');
        if (pass.length < 6) throw new Error('رمز حداقل ۶ کاراکتر');
        var reg = await sb.rpc('host_register', { p_email: email, p_hash: hash, p_name: email.split('@')[0] });
        if (reg.error) throw reg.error;
        data = reg.data;
      } else {
        var log = await sb.rpc('host_login', { p_email: email, p_hash: hash });
        if (log.error) throw log.error;
        data = log.data;
      }
      if (typeof data === 'string') { try { data = JSON.parse(data); } catch (_) {} }
      if (!data || data.ok === false) throw new Error((data && data.error) || 'خطا');
      if (data.user) { data.user.project_limit = 99999; data.user.plan = 'free'; }
      saveUser(data.user);
      toast(mode === 'signup' ? 'ثبت‌نام موفق — خوش آمدی' : 'ورود موفق');
      bootApp();
    } catch (err) {
      console.error(err);
      msg.className = 'msg err';
      var t = (err && err.message) || 'خطا';
      if (/Could not find the function|PGRST202|404|does not exist|gen_salt/i.test(t)) {
        t = 'SQL جدید را در Supabase Run کن.';
      }
      msg.textContent = t;
    } finally { btn.disabled = false; }
  };

  $('#menu-btn').onclick = function (e) {
    e.stopPropagation();
    $('#menu-drop').classList.toggle('hidden');
  };
  document.addEventListener('click', function () { $('#menu-drop').classList.add('hidden'); });
  $('#menu-logout').onclick = function () {
    saveUser(null); currentProject = null;
    appScreen.classList.remove('show'); authScreen.classList.remove('hidden');
    toast('خارج شدی');
  };
  $('#menu-projects').onclick = function () { currentProject = null; renderDashboard(); };

  function bootApp() {
    if (!user) return;
    authScreen.classList.add('hidden');
    appScreen.classList.add('show');
    $('#menu-name').textContent = user.display_name || (user.email || '').split('@')[0];
    $('#menu-email').textContent = user.email || '';
    renderDashboard();
  }

  function slugify(name) {
    var base = String(name || 'project').toLowerCase().replace(/[^a-z0-9\u0600-\u06ff]+/gi, '-').replace(/^-+|-+$/g, '').slice(0, 36) || 'project';
    return base + '-' + Math.random().toString(36).slice(2, 7);
  }

  async function renderDashboard() {
    currentProject = null;
    var pr = await sb.from('host_projects').select('*').eq('user_id', user.id).order('created_at', { ascending: false });
    allProjects = pr.data || [];
    var list = allProjects;

    main.innerHTML =
      '<div class="welcome">' +
        '<div><h2>سلام ' + esc(user.display_name || 'کاربر') + ' 👋</h2>' +
        '<p>الان می‌تونی <b>نامحدود</b> پروژه رایگان بسازی، فایل آپلود کنی و لینک عمومی بگیری.</p>' +
        '<div class="stats">' +
          '<div class="stat"><b>' + list.length + '</b><span>پروژه</span></div>' +
          '<div class="stat"><b>∞</b><span>سقف رایگان</span></div>' +
        '</div></div>' +
        '<div class="badge-free">Free · Unlimited</div>' +
      '</div>' +
      '<div class="grid2">' +
        '<div class="card anim"><h3>پروژه جدید</h3><p>یک پروژه بساز، HTML بگذار و همان لحظه لینک عمومی بگیر.</p>' +
        '<button type="button" class="btn btn-green" id="btn-new">+ ساخت پروژه</button></div>' +
        '<div class="card anim anim-d1"><h3>اشتراک‌ها</h3><p>فعلاً همه چیز رایگان و نامحدود است. پلن‌های پولی بعداً می‌آید.</p>' +
        '<div class="plans">' +
          '<div class="plan"><div><strong>۱۰۰٬۰۰۰ ت</strong><br><span>۵ پروژه</span></div><span class="tag">به‌زودی</span></div>' +
          '<div class="plan"><div><strong>۲۹۹٬۰۰۰ ت</strong><br><span>۱۰ پروژه</span></div><span class="tag">به‌زودی</span></div>' +
          '<div class="plan"><div><strong>۹۹۹٬۰۰۰ ت</strong><br><span>نامحدود</span></div><span class="tag">به‌زودی</span></div>' +
        '</div></div>' +
      '</div>' +
      '<div class="section-h"><span>پروژه‌های من</span>' +
        '<div class="tools"><input class="search" id="search" placeholder="جستجوی پروژه..."><span style="color:var(--muted);font-size:.85rem">' + list.length + ' پروژه</span></div>' +
      '</div><div class="plist" id="plist"></div>';

    function paint(items) {
      var box = $('#plist');
      if (!items.length) {
        box.innerHTML = '<div class="empty">پروژه‌ای نیست. روی «ساخت پروژه» بزن.</div>';
        return;
      }
      box.innerHTML = items.map(function (p, i) {
        return '<div class="prow" style="animation-delay:' + (i * 0.04) + 's" data-id="' + p.id + '">' +
          '<div><div class="n">' + esc(p.name) + '</div><div class="s">' + esc(projectUrl(p.slug)) + '</div>' +
          '<div class="meta">به‌روزرسانی: ' + esc(fmtDate(p.updated_at || p.created_at)) + '</div></div>' +
          '<div class="acts">' +
            '<button type="button" class="btn btn-soft btn-open">باز کردن</button>' +
            '<button type="button" class="btn btn-soft btn-preview">پیش‌نمایش</button>' +
            '<button type="button" class="btn btn-soft btn-copy">کپی لینک</button>' +
            '<button type="button" class="btn btn-soft btn-ren">تغییر نام</button>' +
            '<button type="button" class="btn btn-danger btn-del">حذف</button>' +
          '</div></div>';
      }).join('');
      box.querySelectorAll('.prow').forEach(function (row) {
        var p = items.find(function (x) { return x.id === row.getAttribute('data-id'); });
        row.querySelector('.btn-open').onclick = function () { openProject(p); };
        row.querySelector('.btn-preview').onclick = function () { window.open(projectUrl(p.slug), '_blank'); };
        row.querySelector('.btn-copy').onclick = async function () {
          try { await navigator.clipboard.writeText(projectUrl(p.slug)); toast('لینک کپی شد'); }
          catch (e) { prompt('لینک', projectUrl(p.slug)); }
        };
        row.querySelector('.btn-ren').onclick = async function () {
          var name = prompt('نام جدید', p.name);
          if (!name || name === p.name) return;
          var u = await sb.from('host_projects').update({ name: name.trim(), updated_at: new Date().toISOString() }).eq('id', p.id);
          if (u.error) { toast(u.error.message); return; }
          toast('نام عوض شد');
          renderDashboard();
        };
        row.querySelector('.btn-del').onclick = async function () {
          if (!confirm('پروژه «' + p.name + '» حذف شود؟')) return;
          await sb.from('host_files').delete().eq('project_id', p.id);
          await sb.from('host_projects').delete().eq('id', p.id);
          toast('پروژه حذف شد');
          renderDashboard();
        };
      });
    }
    paint(list);

    $('#search').oninput = function () {
      var q = this.value.trim().toLowerCase();
      paint(allProjects.filter(function (p) {
        return !q || String(p.name).toLowerCase().indexOf(q) >= 0 || String(p.slug).toLowerCase().indexOf(q) >= 0;
      }));
    };

    $('#btn-new').onclick = async function () {
      var name = prompt('نام پروژه', 'my-site');
      if (!name) return;
      var slug = slugify(name);
      var ins = await sb.from('host_projects').insert({ user_id: user.id, name: name.trim(), slug: slug }).select().single();
      if (ins.error) { toast(ins.error.message); return; }
      var starter = '<!DOCTYPE html>\n<html lang="fa" dir="rtl">\n<head>\n<meta charset="UTF-8">\n<meta name="viewport" content="width=device-width, initial-scale=1.0">\n<title>' + esc(name) + '</title>\n<style>\nbody{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Tahoma,sans-serif;background:linear-gradient(160deg,#eef2ff,#dbeafe);color:#0f172a}\n.box{background:#fff;padding:2rem 2.2rem;border-radius:18px;box-shadow:0 20px 50px rgba(37,99,235,.15);text-align:center;animation:up .6s ease both}\n@keyframes up{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}\nh1{margin:0 0 .45rem;font-size:1.35rem;color:#1d4ed8}\np{margin:0;color:#64748b}\n</style>\n</head>\n<body>\n<div class="box"><h1>' + esc(name) + '</h1><p>میزبانی‌شده روی Lumera Host</p></div>\n</body>\n</html>';
      await sb.from('host_files').insert({ project_id: ins.data.id, filename: 'index.html', content: starter });
      toast('پروژه ساخته شد');
      openProject(ins.data);
    };
  }

  async function openProject(p) {
    currentProject = p;
    var fr = await sb.from('host_files').select('*').eq('project_id', p.id).order('filename');
    var list = fr.data || [];
    var url = projectUrl(p.slug);
    main.innerHTML =
      '<div class="ws-head"><div><button type="button" class="btn btn-soft" id="back">→ داشبورد</button>' +
      '<h2 style="margin-top:10px;font-size:1.25rem">' + esc(p.name) + '</h2>' +
      '<div style="color:var(--muted);font-size:.82rem;margin-top:4px">' + list.length + ' فایل</div></div>' +
      '<div class="linkbar"><code id="plink">' + esc(url) + '</code>' +
      '<button type="button" class="btn btn-main" id="copy" style="width:auto;padding:8px 12px">کپی</button>' +
      '<a class="btn btn-soft" href="' + url + '" target="_blank" rel="noopener" style="width:auto">باز کردن</a>' +
      '<button type="button" class="btn btn-soft" id="btn-prev" style="width:auto">پیش‌نمایش سریع</button></div></div>' +
      '<div class="card anim"><h3>فایل‌های پروژه</h3>' +
      '<p style="color:var(--muted);font-size:.88rem;margin-bottom:8px">آپلود، ویرایش، جایگزین، دانلود متن یا حذف</p>' +
      '<div class="flist" id="flist"></div>' +
      '<div class="drop" id="drop"><div style="font-weight:800;color:var(--blue)">آپلود فایل</div>' +
      '<div style="color:var(--muted);font-size:.85rem;margin-top:6px">بکش و رها کن · HTML / CSS / JS / TXT</div>' +
      '<input type="file" id="fin" multiple accept=".html,.htm,.css,.js,.txt,.json,.svg,.md,text/*"></div>' +
      '<div style="margin-top:12px;display:flex;gap:8px;flex-wrap:wrap">' +
      '<button type="button" class="btn btn-soft" id="newf">+ فایل جدید</button>' +
      '<button type="button" class="btn btn-soft" id="btn-blank">صفحه خالی HTML</button></div></div>';

    $('#back').onclick = function () { renderDashboard(); };
    $('#copy').onclick = async function () {
      try { await navigator.clipboard.writeText(url); toast('لینک کپی شد'); } catch (e) { prompt('لینک', url); }
    };
    $('#btn-prev').onclick = function () { window.open(url, '_blank'); };

    var fl = $('#flist');
    function paint(items) {
      if (!items.length) { fl.innerHTML = '<div class="empty">فایلی نیست — یک index.html بساز یا آپلود کن.</div>'; return; }
      fl.innerHTML = items.map(function (f, i) {
        var size = new Blob([f.content || '']).size;
        return '<div class="frow" style="animation-delay:' + (i * 0.03) + 's" data-id="' + f.id + '">' +
          '<div><div class="fn">' + esc(f.filename) + '</div>' +
          '<div style="font-size:.72rem;color:#94a3b8;margin-top:3px">' + size + ' بایت</div></div>' +
          '<div class="acts">' +
          '<button type="button" class="btn btn-soft btn-ed">ویرایش</button>' +
          '<button type="button" class="btn btn-soft btn-dl">دانلود</button>' +
          '<button type="button" class="btn btn-soft btn-rp">جایگزین</button>' +
          '<button type="button" class="btn btn-danger btn-rm">حذف</button></div></div>';
      }).join('');
      fl.querySelectorAll('.frow').forEach(function (row) {
        var f = items.find(function (x) { return x.id === row.getAttribute('data-id'); });
        row.querySelector('.btn-ed').onclick = function () { openEditor(f); };
        row.querySelector('.btn-dl').onclick = function () {
          var a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([f.content || ''], { type: 'text/plain;charset=utf-8' }));
          a.download = f.filename || 'file.txt';
          a.click();
          toast('دانلود شروع شد');
        };
        row.querySelector('.btn-rm').onclick = async function () {
          if (!confirm('حذف ' + f.filename + '؟')) return;
          await sb.from('host_files').delete().eq('id', f.id);
          toast('حذف شد');
          openProject(p);
        };
        row.querySelector('.btn-rp').onclick = function () {
          var inp = document.createElement('input');
          inp.type = 'file';
          inp.onchange = async function () {
            var file = inp.files && inp.files[0];
            if (!file) return;
            var text = await file.text();
            await sb.from('host_files').update({ content: text, filename: file.name || f.filename, updated_at: new Date().toISOString() }).eq('id', f.id);
            await sb.from('host_projects').update({ updated_at: new Date().toISOString() }).eq('id', p.id);
            toast('جایگزین شد');
            openProject(p);
          };
          inp.click();
        };
      });
    }
    paint(list);

    var drop = $('#drop'), fin = $('#fin');
    drop.addEventListener('dragover', function (e) { e.preventDefault(); drop.classList.add('on'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('on'); });
    drop.addEventListener('drop', function (e) {
      e.preventDefault(); drop.classList.remove('on');
      if (e.dataTransfer.files) uploadFiles(e.dataTransfer.files, list);
    });
    fin.onchange = function () { uploadFiles(fin.files, list); };

    async function uploadFiles(fileList, existing) {
      var arr = Array.from(fileList || []);
      for (var i = 0; i < arr.length; i++) {
        var file = arr[i];
        var text = await file.text();
        var filename = file.name || 'file.txt';
        var found = existing.find(function (f) { return f.filename === filename; });
        if (found) await sb.from('host_files').update({ content: text, updated_at: new Date().toISOString() }).eq('id', found.id);
        else await sb.from('host_files').insert({ project_id: p.id, filename: filename, content: text });
      }
      await sb.from('host_projects').update({ updated_at: new Date().toISOString() }).eq('id', p.id);
      toast(arr.length + ' فایل ذخیره شد');
      openProject(p);
    }

    $('#newf').onclick = async function () {
      var filename = prompt('نام فایل', 'page.html');
      if (!filename) return;
      var content = /\.html?$/i.test(filename) ? '<!DOCTYPE html>\n<html><head><meta charset="UTF-8"><title>New</title></head><body><h1>Hello</h1></body></html>' : '';
      await sb.from('host_files').insert({ project_id: p.id, filename: filename, content: content });
      toast('فایل ساخته شد');
      openProject(p);
    };
    $('#btn-blank').onclick = async function () {
      var filename = 'blank-' + Date.now() + '.html';
      await sb.from('host_files').insert({
        project_id: p.id,
        filename: filename,
        content: '<!DOCTYPE html>\n<html lang="fa" dir="rtl">\n<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Blank</title></head>\n<body style="font-family:Tahoma;padding:2rem"><h1>صفحه خالی</h1></body>\n</html>'
      });
      toast('صفحه خالی اضافه شد');
      openProject(p);
    };
  }

  function openEditor(file) {
    var back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = '<div class="modal"><h3>ویرایش · ' + esc(file.filename) + '</h3>' +
      '<div class="field"><label>نام فایل</label><input id="ed-name" dir="ltr" value="' + esc(file.filename) + '"></div>' +
      '<div class="field"><label>محتوا</label><textarea id="ed-body" spellcheck="false"></textarea></div>' +
      '<div class="modal-actions">' +
      '<button type="button" class="btn btn-main" id="ed-save" style="width:auto">ذخیره</button>' +
      '<button type="button" class="btn btn-soft" id="ed-cancel" style="width:auto">بستن</button></div></div>';
    document.body.appendChild(back);
    back.querySelector('#ed-body').value = file.content || '';
    back.querySelector('#ed-cancel').onclick = function () { back.remove(); };
    back.onclick = function (e) { if (e.target === back) back.remove(); };
    back.querySelector('#ed-save').onclick = async function () {
      var filename = back.querySelector('#ed-name').value.trim();
      var content = back.querySelector('#ed-body').value;
      if (!filename) { toast('نام فایل لازم است'); return; }
      var u = await sb.from('host_files').update({ filename: filename, content: content, updated_at: new Date().toISOString() }).eq('id', file.id);
      if (u.error) { toast(u.error.message); return; }
      if (currentProject) await sb.from('host_projects').update({ updated_at: new Date().toISOString() }).eq('id', currentProject.id);
      back.remove();
      toast('ذخیره شد');
      if (currentProject) openProject(currentProject);
    };
  }

  (async function () {
    if (await tryPublicView()) return;
    if (loadUser()) bootApp();
  })();
})();
</script>
</body>
</html>
